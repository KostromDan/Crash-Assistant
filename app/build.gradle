plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'dev.kostromdan.mods'
version = ''

def generatedSvgIconsDir = layout.buildDirectory.dir('generated/sources/svgIcons/java/main')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

sourceSets {
    main {
        java.srcDir generatedSvgIconsDir
    }
    svgCodegen {
        java.srcDirs = ['src/svgCodegen/java']
    }
    java9 {
        java {
            srcDirs = ['src/main/java9']
        }
    }
}

compileJava9Java {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(9)
    }
    sourceCompatibility = JavaVersion.VERSION_1_9
    targetCompatibility = JavaVersion.VERSION_1_9
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
}

repositories {
    mavenCentral()
    maven {
        url 'https://repo.lwjgl.org/'
    }
    maven {
        url = "https://maven.wagyourtail.xyz/snapshots"
    }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
}

def lwjglVersion = '3.1.0'
def lwjglNatives = {
    def osName = System.getProperty('os.name').toLowerCase()
    if (osName.contains('win')) {
        return 'natives-windows'
    } else if (osName.contains('mac')) {
        return 'natives-macos'
    } else if (osName.contains('nix') || osName.contains('nux') || osName.contains('aix')) {
        return 'natives-linux'
    } else {
        throw new GradleException('Unsupported operating system')
    }
}()

dependencies {
    implementation 'com.formdev:flatlaf:3.7'
    implementation "org.apache.commons:commons-jexl3:$jexl_version"
    implementation 'org.apache.logging.log4j:log4j-core:2.0-beta9'
    implementation 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    implementation 'com.electronwill.night-config:toml:3.6.3'
    implementation 'com.electronwill.night-config:json:3.6.3'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'net.java.dev.jna:jna:4.4.0'
    implementation 'net.java.dev.jna:platform:3.4.0'
    implementation 'oshi-project:oshi-core:1.1'
    implementation 'org.quiltmc.parsers:json:0.3.1'

    implementation "org.lwjgl:lwjgl:$lwjglVersion"
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
    implementation "org.lwjgl:lwjgl-vulkan:$lwjglVersion"

    implementation project(path: ':common_config')
}

jar {
    manifest {
        attributes(
                'Main-Class': 'dev.kostromdan.mods.crash_assistant.app.class_loading.Boot',
                'Enable-Native-Access': 'ALL-UNNAMED', // Java 22+ prevents warnings and upcoming JNI restrictions in Java 25+
                'Multi-Release': 'true'
        )
    }
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    dependsOn compileJava9Java
}

shadowJar {
    from("$rootDir/LICENSE.md") {
        rename { "CRASH_ASSISTANT_LICENSE.md" }
        into ""
    }
    from("$rootDir/thirdparty") {
        into "thirdparty"
    }
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    dependsOn compileJava9Java

    dependsOn(':common_config:build')
    archiveClassifier.set('')

    // Relocate Night Config packages
    relocate 'com.electronwill.nightconfig', 'crash_assistant_relocated_libs.nightconfig'
    relocate 'org.apache.commons.jexl3', 'crash_assistant_relocated_libs.jexl3'
    relocate 'org.apache.commons.logging', 'crash_assistant_relocated_libs.logging'

    dependencies {
        exclude(dependency('org.apache.logging.log4j:.*'))
        exclude(dependency('com.google.code.gson:.*'))
        exclude(dependency('commons-io:commons-io:2.15.1'))
        exclude(dependency('com.electronwill.night-config:.*'))
        exclude(dependency('org.apache.commons:commons-jexl3:.*'))
        exclude(dependency('commons-logging:commons-logging:.*'))
        exclude(dependency('net.java.dev.jna:.*'))
        exclude(dependency('com.github.oshi:oshi-core:.*'))
        exclude(dependency('oshi-project:.*'))
        exclude(dependency('org.slf4j:.*'))
        exclude(dependency('org.lwjgl:.*'))
        exclude(dependency('org.jetbrains:.*'))
        exclude(project(':common_config'))
        exclude("META-INF/LICENSE")
        exclude("LICENSE")
        exclude("META-INF/maven/**")
        exclude "META-INF/LICENSE.txt"
        exclude "META-INF/NOTICE.txt"
    }
}

tasks.register('generateSvgIcons', JavaExec) {
    group = 'build'
    description = 'Compiles fixed SVG assets into dependency-free Java2D painters.'
    dependsOn compileSvgCodegenJava
    classpath = sourceSets.svgCodegen.runtimeClasspath
    mainClass = 'dev.kostromdan.mods.crash_assistant.svg_codegen.SvgIconGenerator'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }

    def logoSvg = file('src/main/resources/assets/logo.svg')
    def internetSvg = file('src/main/resources/assets/internet.svg')
    inputs.files logoSvg, internetSvg
    outputs.dir generatedSvgIconsDir
    args generatedSvgIconsDir.get().asFile.absolutePath,
            'dev.kostromdan.mods.crash_assistant.app.gui',
            logoSvg.absolutePath, 'GeneratedLogoIcon',
            internetSvg.absolutePath, 'GeneratedInternetIcon'

    doFirst {
        delete generatedSvgIconsDir
    }
}

compileJava.dependsOn generateSvgIcons

processResources {
    exclude 'assets/logo.svg', 'assets/internet.svg'
}

tasks.register('parallelsJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'Builds a self-contained Crash Assistant JAR for Parallels test VMs.'
    archiveClassifier.set('parallels')
    configurations = [project.configurations.runtimeClasspath]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    zip64 = true

    from sourceSets.main.output
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    dependsOn compileJava9Java

    from("$rootDir/LICENSE.md") {
        rename { 'CRASH_ASSISTANT_LICENSE.md' }
        into ''
    }
    from("$rootDir/thirdparty") {
        into 'thirdparty'
    }

    manifest {
        attributes(
                'Main-Class': 'dev.kostromdan.mods.crash_assistant.app.CrashAssistantApp',
                'Enable-Native-Access': 'ALL-UNNAMED',
                'Multi-Release': 'true'
        )
    }

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

build.finalizedBy(shadowJar)

tasks.register('securityRegressionTest', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.kostromdan.mods.crash_assistant.app.scripts.SecurityRegressionTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    def testWorkDir = layout.buildDirectory.dir('security-test-workdir').get().asFile
    doFirst {
        testWorkDir.mkdirs()
        def devMarker = new File(testWorkDir, 'app/src/main/java/dev/kostromdan/mods/crash_assistant/app/CrashAssistantApp.java')
        devMarker.parentFile.mkdirs()
        devMarker.createNewFile()
    }
    workingDir testWorkDir
}

tasks.register('logReaderCurseForgeStdoutTest', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.kostromdan.mods.crash_assistant.app.logs_analyser.LogReaderCurseForgeStdoutTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

check.dependsOn securityRegressionTest, logReaderCurseForgeStdoutTest
