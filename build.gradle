plugins {
    id 'base'
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.115' apply false
}

def commonConfigJar = file("${rootDir}/app_common-config_libs/common_config_1_18_2__upper.jar")
if (!commonConfigJar.exists()) {
    def currentBranch = "git rev-parse --abbrev-ref HEAD".execute(null, rootDir).text.trim()
    throw new GradleException(
            "File not found: ${commonConfigJar.absolutePath}\n\n" +
                    "To build it:\n" +
                    "  1. Switch to the app-common-config branch\n" +
                    "  2. Run the build\n" +
                    "  3. Switch back to your current branch (${currentBranch})\n" +
                    "  4. Try running the build again\n\n" +
                    "Commands to copy-paste:\n\n" +
                    "git checkout app-common-config\n" +
                    ".\\gradlew.bat clean build\n" +
                    "git checkout ${currentBranch}\n" +
                    ".\\gradlew.bat clean build\n "
    )
}

apply plugin: 'idea'
idea {
    module {
        downloadSources = true
    }
}


task collectJars(type: Copy) {
    dependsOn(
            ":neoforge_coremod:build"
    )

    from("fabric/build/libs") {
        include '*.jar'
        exclude '*-sources.jar', '*-javadoc.jar', '*-dev-shadow.jar'
    }

    from("forge_coremod/build/libs") {
        include '*.jar'
        exclude '*-sources.jar', '*-javadoc.jar', '*-dev-shadow.jar'
        rename { originalName ->
            originalName.replace("_coremod", "")
        }
    }

    from("neoforge_coremod/build/libs") {
        include '*.jar'
        exclude '*-sources.jar', '*-javadoc.jar', '*-dev-shadow.jar'
        rename { originalName ->
            originalName.replace("_coremod", "")
        }
    }

    into("$rootDir/build/libs")
}

build.finalizedBy(collectJars)

task publishUnified {
    group = "upload"
    dependsOn(":neoforge_coremod:publishUnified")
}

task publishUnifiedToLocal {
    group = "upload"
    dependsOn(":neoforge_coremod:publishUnifiedToLocal")
}
