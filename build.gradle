plugins {
    id 'java'
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

group 'dev.kostromdan.mods.crash_assistant'

base {
    archivesName = '!!!CrashAssistant-' + minecraft_version
}


sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

sourceSets {
    fabric {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    forge {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.wagyourtail.xyz/snapshots"
    }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
}

unimined.minecraft {
    version project.minecraft_version

    mappings {
        intermediary()
        mojmap()
    }

    defaultRemapJar = false
}

unimined.minecraft(sourceSets.fabric) {
    combineWith(sourceSets.main)

    fabric {
        loader project.fabric_version
    }

    defaultRemapJar = true
}

unimined.minecraft(sourceSets.forge) {
    combineWith(sourceSets.main)

    minecraftForge {
        loader project.forge_version
        mixinConfig "crash_assistant.mixins.json", "crash_assistant-forge.mixins.json"
    }

    defaultRemapJar = true
}

configurations {
    mainImplementation
    implementation {
        extendsFrom forgeImplementation
        extendsFrom fabricImplementation
    }
}

sourceSets {
    main {
        compileClasspath += configurations.mainImplementation
        runtimeClasspath += configurations.mainImplementation
    }
}

dependencies {
    mainImplementation "org.spongepowered:mixin:0.8.5-SNAPSHOT"
    fabricImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation project(path: ':common_config')
    forgeImplementation project(path: ':common_config')
    fabricImplementation project(path: ':common_config')
}

[forgeJar, fabricJar].each { task ->
    task.configure {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        evaluationDependsOn(':app')
        dependsOn project(':app').tasks.named('shadowJar')

        from("$rootDir/LICENSE.md") {
            rename { "CRASH_ASSISTANT_LICENSE.md" }
            into ""
        }
        from("$rootDir/thirdparty") {
            into "thirdparty"
        }

        from(project(':app').tasks.shadowJar) {
            into 'META-INF/jarjar'
        }
        evaluationDependsOn(':common_config')
        dependsOn project(':common_config').tasks.named('shadowJar')
        from {
            zipTree(
                    project(':common_config').tasks.named('shadowJar').get().archiveFile.get().asFile
            )
        }
    }
}

def configureJarNames() {
    def jarConfigurations = [
            remapForgeJar : "!!!CrashAssistant-forge-${minecraft_version}-${version}.jar",
            remapFabricJar: "!!!CrashAssistant-fabric-${minecraft_version}-${version}.jar",
            forgeJar      : "!!!CrashAssistant-forge-${minecraft_version}-${version}-dev.jar",
            fabricJar     : "!!!CrashAssistant-fabric-${minecraft_version}-${version}-dev.jar"
    ]

    jarConfigurations.each { taskName, fileName ->
        tasks.named(taskName) {
            archiveFileName = fileName
        }
    }
}

configureJarNames()

['compileJava', 'compileFabricJava', 'compileForgeJava'].each { taskName ->
    tasks.named(taskName) {
        dependsOn project(':common_config').tasks.named('shadowJar')
    }
}

project(':app') {
    tasks.withType(JavaCompile).configureEach {
        dependsOn project(':common_config').tasks.named('shadowJar')
    }
}

jar {
    enabled = false
}

processFabricResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

processForgeResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

unifiedPublishing {
    project {
        gameVersions = [minecraft_version]
        gameLoaders = ["forge"]

        displayName = tasks.remapForgeJar.archiveFile.get().asFile.name
        version = rootProject.version
        changelog = file('changelog.md').text
        releaseType = release_type

        mainPublication tasks.remapForgeJar

        var cfToken = System.getenv("CF_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = "1154099"
            }
        }

        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = "ix1qq8Ux"
            }
        }
    }
}