plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

group 'dev.kostromdan.mods.crash_assistant'

base {
    archivesName = '!!!CrashAssistant-1.7.10'
}


sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

sourceSets {
    fabric {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    forge {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    maven {
        name = "wagyourtail releases"
        url = "https://maven.wagyourtail.xyz/releases"
    }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
    mavenCentral()
}

unimined.minecraft {
    version project.minecraft_version

    mappings {
        searge()
        mcp("stable", "12-1.7.10")
    }

    defaultRemapJar = false
}

unimined.minecraft(sourceSets.fabric) {
    combineWith(sourceSets.main)

    legacyFabric {
        loader project.fabric_version
    }

    defaultRemapJar = true
}

unimined.minecraft(sourceSets.forge) {
    combineWith(sourceSets.main)

    minecraftForge {
        loader project.forge_version
//        mixinConfig "modid.mixins.json"
    }

    defaultRemapJar = true
}

configurations {
    mainImplementation
    implementation {
        extendsFrom forgeImplementation
        extendsFrom fabricImplementation
    }
}

sourceSets {
    main {
        compileClasspath += configurations.mainImplementation
        runtimeClasspath += configurations.mainImplementation
    }
}

dependencies {
    implementation project(path: ':common_config')
    forgeImplementation project(path: ':common_config')
}

[forgeJar, fabricJar].each { task ->
    task.configure {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        evaluationDependsOn(':app')
        dependsOn project(':app').tasks.named('shadowJar')

        from("$rootDir/LICENSE.md") {
            rename { "CRASH_ASSISTANT_LICENSE.md" }
            into ""
        }
        from("$rootDir/thirdparty") {
            into "thirdparty"
        }

        from(project(':app').tasks.shadowJar) {
            into 'META-INF/jarjar'
        }
        evaluationDependsOn(':common_config')
        dependsOn project(':common_config').tasks.named('shadowJar')
        from {
            zipTree(
                    project(':common_config').tasks.named('shadowJar').get().archiveFile.get().asFile
            )
        }
    }
}

forgeJar {
    manifest {
        attributes([
                'FMLCorePluginContainsFMLMod': 'true',
                'FMLCorePlugin'              : 'dev.kostromdan.mods.crash_assistant.forge_coremod.CrashAssistantEntrypoint'
        ])
    }
}

tasks.named("remapForgeJar") {
    archiveFileName = "!!!CrashAssistant-forge-1.7.10-" + version + ".jar"
}
tasks.named("remapFabricJar") {
    archiveFileName = "!!!CrashAssistant-fabric-1.7.10-" + version + ".jar"
}
forge


['compileJava', 'compileFabricJava', 'compileForgeJava'].each { taskName ->
    tasks.named(taskName) {
        dependsOn project(':common_config').tasks.named('shadowJar')
    }
}

project(':app') {
    tasks.withType(JavaCompile).configureEach {
        dependsOn project(':common_config').tasks.named('shadowJar')
    }
}

jar {
    enabled = false
}

processFabricResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

processForgeResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }

    filesMatching("mcmod.info") {
        expand "version": project.version
    }
}