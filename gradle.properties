neo_version=26.2.0.1-beta
neoforge_loader_version_range=[4,)
neo_version_range=[26.2,)
neo_minecraft_version=1.26.2
neo_minecraft_version_range=[26.2,)

forge_version=65.0.0
forge_loader_version_range=[65,)
forge_version_range=[65,)
