plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version '2.0.141' apply false
	id 'net.minecraftforge.gradle' version '[7.0.17,8)' apply false
	id "com.modrinth.minotaur" version "2.+" apply false
	id "net.darkhax.curseforgegradle" version "1.1.+" apply false
}

apply plugin: 'idea'

def commonConfigJar = file("${rootDir}/app_common-config_libs/common_config_1_18_2__upper.jar")
if (!commonConfigJar.exists()) {
	def currentBranch = "git rev-parse --abbrev-ref HEAD".execute(null, rootDir).text.trim()
	throw new GradleException(
			"File not found: ${commonConfigJar.absolutePath}\n\n" +
					"To build it:\n" +
					"  1. Switch to the app-common-config branch\n" +
					"  2. Run the build\n" +
					"  3. Switch back to your current branch (${currentBranch})\n" +
					"  4. Try running the build again\n\n" +
					"Commands to copy-paste:\n\n" +
					"git checkout app-common-config\n" +
					".\\gradlew.bat clean build\n" +
					"git checkout ${currentBranch}\n" +
					".\\gradlew.bat clean build\n "
	)
}

allprojects {
	apply plugin: 'java-library'
	dependencies {
		implementation files("${rootProject.projectDir}/app_common-config_libs/common_config_1_18_2__upper.jar")
	}
}

jar.enabled = false

subprojects {
	version = project.version
	group = project.maven_group

	base {
		archivesName = project.archives_base_name
	}

	repositories {
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}

task collectJars(type: Copy) {
	dependsOn(
		":fabric:build",
		":neoforge_coremod:build",
		":forge_coremod:build",
	)

	from("fabric/build/libs") {
		include '*.jar'
	}
	from("neoforge_coremod/build/libs") {
		include '*.jar'
	}
	from("forge_coremod/build/libs") {
		include '*.jar'
	}

	into("$rootDir/build/libs")
}

build.finalizedBy(collectJars)

task publishUnified {
	group = "upload"
	dependsOn(
			":fabric:publishUnified",
			":neoforge_coremod:publishUnified",
			":forge_coremod:publishUnified"
	)
}

task publishUnifiedToLocal {
	group = "upload"
	dependsOn(
			":fabric:publishUnifiedToLocal",
			":neoforge_coremod:publishUnifiedToLocal",
			":forge_coremod:publishUnifiedToLocal"
	)
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}