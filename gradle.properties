version=1.11.12
release_type=release

mod_name=Crash Assistant
mod_author=KostromDan
mod_id=crash_assistant
mod_description=Shows a GUI after Minecraft crashes, immediately showing all affected logs, crash reports, or hs_err files. Provides a one-click solution to upload them, copy the link, and perform other actions for easier reporting, debugging, and troubleshooting, like analysis log for the most common crash reasons.
license=KostromDan's Modded Minecraft License (Version 1.1.3)
homepage_url=https://www.curseforge.com/minecraft/mc-mods/crash-assistant
sources_url=https://github.com/KostromDan/Crash-Assistant
issues_url=https://github.com/KostromDan/Crash-Assistant/issues
credits=

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Common Minecraft Properties
minecraft_version=26.2

# Mod Properties
maven_group=dev.kostromdan.mods.crash_assistant
archives_base_name=crash-assistant

# Fabric Properties
# check these on https://fabricmc.net/develop
loader_version=0.19.3
loom_version=1.15-SNAPSHOT
fabric_minecraft_version_range=>=26.2

