plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}
version = ''

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1' // Same as main app, but add gson, because provided by legacy Minecraft has bug, which I don't want to fix or investigate.
}

shadowJar {
    dependsOn(':app:shadowJar')

    archiveClassifier.set('')

    // This artifact is embedded as META-INF/jarjar/app.jar. Keep the
    // multi-release marker on the nested app only; the enclosing common_config
    // artifacts must remain ordinary JARs.
    manifest {
        attributes('Multi-Release': 'true')
    }

    from(project(':app').layout.buildDirectory.file('libs/app.jar'))
}

build.finalizedBy(shadowJar)
