plugins {
    id 'java'
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

def commonConfigJar = file("${rootDir}/app_common-config_libs/common_config_1_8__1_16_5.jar")
if (!commonConfigJar.exists()) {
    def currentBranch = "git rev-parse --abbrev-ref HEAD".execute(null, rootDir).text.trim()
    throw new GradleException(
            "File not found: ${commonConfigJar.absolutePath}\n\n" +
                    "To build it:\n" +
                    "  1. Switch to the app-common-config branch\n" +
                    "  2. Run the build\n" +
                    "  3. Switch back to your current branch (${currentBranch})\n" +
                    "  4. Try running the build again\n\n" +
                    "Commands to copy-paste:\n\n" +
                    "git checkout app-common-config\n" +
                    ".\\gradlew.bat clean build\n" +
                    "git checkout ${currentBranch}\n" +
                    ".\\gradlew.bat clean build\n "
    )
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects { subproject ->
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    var archives_name
    base {
        if (subproject.name in ['forge_coremod']) {
            archivesName = "CrashAssistant-forge-1.16.1-1.16.5"
        } else {
            archivesName = "CrashAssistant-$project.name-1.16.5"
        }
        archives_name = archivesName
    }

    repositories {
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
        implementation files("${rootProject.projectDir}/app_common-config_libs/common_config_1_8__1_16_5.jar")
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 8
    }
}

apply plugin: 'idea'
idea {
    module {
        downloadSources = true
    }
}


task collectJars(type: Copy) {
    def deps = [':fabric', ':forge_coremod']
            .collect { path -> project(path).tasks.remapJar }
    dependsOn deps
    from deps

    into 'build/libs'
}

assemble.dependsOn collectJars

task publishUnified {
    group = "upload"
    dependsOn(
            ":fabric:publishUnified",
            ":forge_coremod:publishUnified"
    )
}

task publishUnifiedToLocal {
    group = "upload"
    dependsOn(
            ":fabric:publishUnifiedToLocal",
            ":forge_coremod:publishUnifiedToLocal"
    )
}
