plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version '2.0.140' apply false
}

allprojects {
	apply plugin: 'java-library'
	dependencies {
		implementation files("${rootProject.projectDir}/26_1_libs/common_config.jar")
	}
}

subprojects {
	apply plugin: 'maven-publish'

	version = project.version
	group = project.maven_group

	base {
		archivesName = project.archives_base_name
	}

	repositories {
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}

task collectJars(type: Copy) {
	dependsOn(
		":fabric:build",
		":neoforge_coremod:build",
	)

	from("fabric/build/libs") {
		include '*.jar'
	}
	from("neoforge_coremod/build/libs") {
		include '*.jar'
	}

	into("$rootDir/build/libs")
}

build.finalizedBy(collectJars)
