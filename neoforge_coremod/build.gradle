plugins {
    id 'com.github.johnrengelman.shadow'
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    shadowBundle 'com.electronwill.night-config:toml:3.6.4'
    implementation project(path: ':common_config')
    shadowBundle project(path: ':common_config')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set('dev-shadow')
    relocate 'com.electronwill.nightconfig', 'dev.kostromdan.mods.crash_assistant.nightconfig'
}

remapJar {
    dependsOn(':app:shadowJar', ':neoforge:build')

    from(project(':app').tasks.shadowJar) {
        into 'META-INF/jarjar'
    }
    from(project(':neoforge').tasks.remapJar) {
        rename { String fileName ->
            "crash_assistant-neoforge.jar"
        }
        into 'META-INF/jarjar'
    }

    input.set shadowJar.archiveFile
}

unifiedPublishing {
    project {
        gameVersions = ["1.21.1", "1.21.2", "1.21.3", "1.21.4"]
        gameLoaders = ["neoforge"]

        displayName = tasks.remapJar.archiveFile.get().asFile.name
        version = mod_version
        changelog = file('../changelog.md').text
        releaseType = "beta"

        mainPublication tasks.remapJar

        var cfToken = System.getenv("CF_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = "1154099"
            }
        }

        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = "ix1qq8Ux"
            }
        }
    }
}