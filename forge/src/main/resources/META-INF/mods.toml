modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"
issueTrackerURL="${issues_url}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
logoFile="${mod_id}_logo.png"
credits="${credits}"
authors="${mod_author}"
