# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.11.8
release_type=release

group=dev.kostromdan.mods.crash_assistant
java_version=21

# Common
minecraft_version=1.21.10
mod_name=Crash Assistant
mod_author=KostromDan
mod_id=crash_assistant
license=KostromDan's Modded Minecraft License (Version 1.1.3)
credits=
description=Shows a GUI after Minecraft crashes, immediately showing all affected logs, crash reports, or hs_err files. Provides a one-click solution to upload them, copy the link, and perform other actions for easier reporting, debugging, and troubleshooting, like analysis log for the most common crash reasons.
minecraft_version_range_forge=[1.21.9, 1.22)
minecraft_version_range_fabric=>=1.21.9 <1.22
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.10-20251010.172816
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.9
parchment_version=2025.10.05

# Fabric
fabric_version=0.135.0+1.21.10
fabric_loader_version=0.16.10

# Forge
forge_version=60.0.3
forge_loader_version_range=[60,)

# NeoForge
neoforge_version=21.10.12-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
