plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
    id "com.modrinth.minotaur" version "2.+"
    id "net.darkhax.curseforgegradle" version "1.1.+"
}

def commonConfigJar = file("${rootDir}/app_common-config_libs/common_config_1_7_10.jar")
if (!commonConfigJar.exists()) {
    def currentBranch = "git rev-parse --abbrev-ref HEAD".execute(null, rootDir).text.trim()
    throw new GradleException(
            "File not found: ${commonConfigJar.absolutePath}\n\n" +
                    "To build it:\n" +
                    "  1. Switch to the app-common-config branch\n" +
                    "  2. Run the build\n" +
                    "  3. Switch back to your current branch (${currentBranch})\n" +
                    "  4. Try running the build again\n\n" +
                    "Commands to copy-paste:\n\n" +
                    "git checkout app-common-config\n" +
                    ".\\gradlew.bat clean build\n" +
                    "git checkout ${currentBranch}\n" +
                    ".\\gradlew.bat clean build\n "
    )
}

group 'dev.kostromdan.mods.crash_assistant'

base {
    archivesName = '!!!CrashAssistant-' + minecraft_version
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}


sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

sourceSets {
    fabric {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    forge {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    maven {
        name = "wagyourtail releases"
        url = "https://maven.wagyourtail.xyz/releases"
    }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
    mavenCentral()
}

unimined.minecraft {
    version project.minecraft_version

    mappings {
        forgeBuiltinMCP(project.forge_version)
    }

    minecraftRemapper.config {
        ignoreFieldDesc(true)
        ignoreConflicts(true)
    }

    defaultRemapJar = false
}

unimined.minecraft(sourceSets.fabric) {
    combineWith(sourceSets.main)

    legacyFabric {
        loader project.fabric_version
    }

    defaultRemapJar = true
}

unimined.minecraft(sourceSets.forge) {
    combineWith(sourceSets.main)

    minecraftForge {
        loader project.forge_version
//        mixinConfig "crash_assistant.mixins.json"
    }

    defaultRemapJar = true
}

configurations {
    mainImplementation
    implementation {
        extendsFrom forgeImplementation
        extendsFrom fabricImplementation
    }
}

sourceSets {
    main {
        compileClasspath += configurations.mainImplementation
        runtimeClasspath += configurations.mainImplementation
    }
}

dependencies {
    implementation files("${rootProject.projectDir}/app_common-config_libs/common_config_1_7_10.jar")
    implementation 'org.apache.logging.log4j:log4j-core:2.0-beta9'
    implementation 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    fabricImplementation 'org.apache.logging.log4j:log4j-core:2.0-beta9'
    fabricImplementation 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    fabricInclude('org.apache.logging.log4j:log4j-core:2.0-beta9')
    fabricInclude('org.apache.logging.log4j:log4j-api:2.0-beta9')
    forgeImplementation 'org.apache.logging.log4j:log4j-core:2.0-beta9'
    forgeImplementation 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    forgeImplementation files("${rootProject.projectDir}/app_common-config_libs/common_config_1_7_10.jar")
    fabricImplementation files("${rootProject.projectDir}/app_common-config_libs/common_config_1_7_10.jar")
}

[forgeJar, fabricJar].each { task ->
    task.configure {
        from zipTree("${rootProject.projectDir}/app_common-config_libs/common_config_1_7_10.jar")
    }
}

forgeJar {
    manifest {
        attributes([
                'FMLCorePluginContainsFMLMod': 'true',
                'FMLCorePlugin'              : 'dev.kostromdan.mods.crash_assistant.forge_coremod.CrashAssistantEntrypoint'
        ])
    }
}

def configureJarNames() {
    def jarConfigurations = [
            remapForgeJar : "!!!CrashAssistant-forge-${minecraft_version}-${version}.jar",
            remapFabricJar: "CrashAssistant-fabric-${minecraft_version}-${version}.jar",
            forgeJar      : "!!!CrashAssistant-forge-${minecraft_version}-${version}-dev.jar",
            fabricJar     : "CrashAssistant-fabric-${minecraft_version}-${version}-dev.jar"
    ]

    jarConfigurations.each { taskName, fileName ->
        tasks.named(taskName) {
            archiveFileName = fileName
        }
    }
}

configureJarNames()

jar {
    enabled = false
}

processFabricResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

processForgeResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }

    filesMatching("mcmod.info") {
        expand "version": project.version
    }
}

def parsedChangelog = file('CHANGELOG.md').text.replaceAll(/\r\n|\r/, '\n').split(/(?:^|\n\n)\S.*?(?:\n\n|$)/)[1].trim() +
        "\n\n### [See full changelog](https://kostromdan.github.io/Crash-Assistant/changelog.md)"

if (System.getenv("MODRINTH_TOKEN") != null) {
    modrinth {
        token = System.getenv("MODRINTH_TOKEN")
        projectId = "ix1qq8Ux"
        versionType = release_type
        changelog = parsedChangelog
        gameVersions = [project.minecraft_version]
    }

    tasks.register("modrinthForge", com.modrinth.minotaur.TaskModrinthUpload) {
        group = "upload"
        dependsOn(tasks.named("remapForgeJar"))
        doFirst {
            modrinth.versionNumber.set("${project.version}")
            modrinth.versionName.set(tasks.remapForgeJar.archiveFile.get().asFile.name)
            modrinth.uploadFile.set(tasks.remapForgeJar)
            modrinth.loaders.set(["forge"])
        }
    }

    tasks.register("modrinthFabric", com.modrinth.minotaur.TaskModrinthUpload) {
        group = "upload"
        dependsOn(tasks.named("remapFabricJar"))
        doFirst {
            modrinth.versionNumber.set("${project.version}")
            modrinth.versionName.set(tasks.remapFabricJar.archiveFile.get().asFile.name)
            modrinth.uploadFile.set(tasks.remapFabricJar)
            modrinth.loaders.set(["fabric", "legacy-fabric"])
        }
    }
}

if (System.getenv("CF_TOKEN") != null) {
    tasks.register("publishCurseForge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        group = "upload"
        apiToken = System.getenv("CF_TOKEN")

        def forgeFile = upload("1154099", tasks.remapForgeJar)
        forgeFile.displayName = tasks.remapForgeJar.archiveFile.get().asFile.name
        forgeFile.changelog = parsedChangelog
        forgeFile.changelogType = "markdown"
        forgeFile.releaseType = release_type
        forgeFile.addGameVersion(project.minecraft_version)
        forgeFile.addModLoader("Forge")

        def fabricFile = upload("1154099", tasks.remapFabricJar)
        fabricFile.displayName = tasks.remapFabricJar.archiveFile.get().asFile.name
        fabricFile.changelog = parsedChangelog
        fabricFile.changelogType = "markdown"
        fabricFile.releaseType = release_type
        fabricFile.addGameVersion(project.minecraft_version)
        fabricFile.addModLoader("Fabric")
    }
}

task publishUnified {
    group = "upload"
    if (System.getenv("MODRINTH_TOKEN") != null) {
        dependsOn(tasks.named("modrinthForge"), tasks.named("modrinthFabric"))
    }
    if (System.getenv("CF_TOKEN") != null) {
        dependsOn(tasks.named("publishCurseForge"))
    }
}

task publishUnifiedToLocal(type: Copy) {
    group = "upload"
    dependsOn(tasks.named("remapForgeJar"), tasks.named("remapFabricJar"))

    from(tasks.named("remapForgeJar").get().archiveFile)
    from(tasks.named("remapFabricJar").get().archiveFile)
    into("build/unified-local/project0")
}