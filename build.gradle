plugins {
    id 'base'
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.115' apply false
}

apply plugin: 'idea'
idea {
    module {
        downloadSources = true
    }
}


task collectJars(type: Copy) {
    dependsOn(
            ":neoforge_coremod:build"
    )

    from("fabric/build/libs") {
        include '*.jar'
        exclude '*-sources.jar', '*-javadoc.jar', '*-dev-shadow.jar'
    }

    from("forge_coremod/build/libs") {
        include '*.jar'
        exclude '*-sources.jar', '*-javadoc.jar', '*-dev-shadow.jar'
        rename { originalName ->
            originalName.replace("_coremod", "")
        }
    }

    from("neoforge_coremod/build/libs") {
        include '*.jar'
        exclude '*-sources.jar', '*-javadoc.jar', '*-dev-shadow.jar'
        rename { originalName ->
            originalName.replace("_coremod", "")
        }
    }

    into("$rootDir/build/libs")
}

build.finalizedBy(collectJars)