plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}
version = ''

repositories {
    mavenCentral()
    maven {
        url = "https://maven.wagyourtail.xyz/snapshots"
    }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
}


dependencies {
    implementation 'com.electronwill.night-config:toml:3.6.3'
    implementation 'com.electronwill.night-config:json:3.6.3'
    implementation 'net.java.dev.jna:jna:4.4.0'
    implementation 'net.java.dev.jna:platform:3.4.0'
    implementation 'oshi-project:oshi-core:1.1'
}

shadowJar {
    dependsOn(':common_config:shadowJar')
    dependsOn(':jar_generation:app_legacy:shadowJar')

    archiveClassifier.set('')

    from(project(':common_config').layout.buildDirectory.file('libs/common_config.jar'))

    doLast {
        def jarFile = archiveFile.get().asFile
        def appJarFile = project(':jar_generation:app_legacy').layout.buildDirectory.file('libs/app_legacy.jar').get().asFile
        if (jarFile.exists() && appJarFile.exists()) {
            ant.zip(update: "true", destfile: jarFile) {
                zipfileset(file: appJarFile, fullpath: "META-INF/jarjar/app.jar")
            }
        }
    }

    relocate 'com.electronwill.nightconfig', 'crash_assistant_relocated_libs.nightconfig'
}

build.finalizedBy(shadowJar)
